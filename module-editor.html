<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generalized Module Editor</title><link rel="stylesheet" href="style.css"><style>#editor-fields details{margin:12px 0;padding:12px;border:1px solid #71877f;border-radius:8px}#editor-fields summary{cursor:pointer;font-weight:bold}.v2-table-wrap{overflow-x:auto;margin:12px 0}.v2-table{width:100%;border-collapse:collapse}.v2-table th,.v2-table td{padding:6px;text-align:left}.v2-table input,.v2-table select{min-width:95px;width:100%;padding:8px}.v2-table input[type=number]{min-width:75px;width:85px}#editor-actions{display:flex;flex-wrap:wrap;gap:8px}#editor-fields button{margin:6px 0}.v2-field{display:inline-flex;flex-direction:column;gap:4px;margin:8px;min-width:130px}.v2-field input,.v2-field select{padding:8px;max-width:100%}#editor-fields fieldset{border:1px solid #81948b;border-radius:8px;margin:12px 0;padding:10px;min-width:0}#editor-fields legend{font-weight:bold}</style></head>
<body><main><a href="index.html">Back to workshop</a><h1>Generalized module editor</h1><p>Configure a version 2 rules module. Changes are local until exported.</p>
<div id="editor-actions"><button id="reset">Load Ironwood example</button> <button id="validate">Validate module</button> <button id="export">Export JSON</button> <label>Import JSON <input id="import" type="file" accept=".json,application/json"></label></div>
<p id="editor-status" role="status"></p><div id="editor-fields"></div>
<details><summary>Advanced module JSON</summary><textarea id="source" rows="20" style="width:100%;font-family:monospace"></textarea><button id="apply">Apply JSON changes</button></details></main><script type="module" src="module-editor.js"></script></body></html>
