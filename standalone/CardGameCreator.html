<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#162d29" />
    <title>Card Game Creator · Workshop</title>
    <style>* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #f4f1e8;
  color: #24342f;
  font:
    15px/1.45 "DM Sans",
    system-ui,
    sans-serif;
}
header {
  display: flex;
  align-items: center;
  gap: 13px;
  background: #19332f;
  color: #fff7e8;
  padding: 13px 4vw;
  border-bottom: 3px solid #c89554;
}
header strong {
  font: 600 21px Georgia;
  letter-spacing: -0.6px;
}
.mark {
  font: 32px Georgia;
  color: #eab779;
}
header nav {
  margin: auto;
  display: flex;
  gap: 5px;
}
input,
select,
textarea,
button {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
  background: #fffdf6;
  border: 1px solid #b8bdb1;
  padding: 8px 13px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 14px;
}
button:hover {
  border-color: #365a49;
  background: #e7edde;
}
button:focus-visible,
summary:focus-visible {
  outline: 3px solid #d28438;
  outline-offset: 2px;
}
header button {
  background: transparent;
  color: inherit;
  border-color: transparent;
}
header button:hover,
header button.on {
  background: #38574a;
  color: white;
}
#help {
  border-color: #70847a;
}
.primary {
  background: #2a5044;
  color: white;
  border-color: #2a5044;
}
.primary:hover {
  background: #406950;
}
main {
  max-width: 1570px;
  margin: auto;
  padding: 28px 4vw;
}
.top,
.line,
.actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  flex-wrap: wrap;
}
.top {
  margin-bottom: 23px;
}
small {
  font-size: 10px;
  letter-spacing: 1.8px;
  font-weight: 800;
  color: #516354;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-family: Georgia, serif;
  font-weight: normal;
}
h1 {
  font-size: clamp(34px, 4vw, 54px);
  line-height: 1.13;
}
h2 {
  font-size: 25px;
}
h3 {
  font-size: 19px;
}
.work {
  display: grid;
  grid-template-columns: minmax(175px, 0.85fr) minmax(275px, 1.65fr) minmax(
      250px,
      1.1fr
    );
  border: 1px solid #b9c1b2;
  background: #fcfaf4;
  border-radius: 12px;
  overflow: hidden;
}
.library,
.inspector,
.box {
  padding: 19px;
}
.library {
  border-right: 1px solid #c1c7bb;
}
.inspector {
  border-left: 1px solid #c1c7bb;
}
.stack {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}
.item {
  width: 100%;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  background: transparent;
  border: 1px solid transparent;
  padding: 8px;
}
.item.on,
.tabs .on {
  background: #dde7d7;
  border-color: #9ead97;
}
.mini {
  width: 30px;
  height: 38px;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: #ffe7ae;
  font: 23px Georgia;
  border: 2px solid #253b32;
  border-radius: 3px;
}
.stage,
.battle {
  background-color: #dbe2d3;
  background-image: radial-gradient(#a9b7a4 0.85px, transparent 0.85px);
  background-size: 13px 13px;
}
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  min-height: 465px;
  padding: 26px 10px;
}
.stage small {
  letter-spacing: 2px;
}
.card {
  background: #f1deaf;
  color: #332e23;
  border: 6px solid #2c342a;
  border-radius: 14px;
  width: min(245px, 96%);
  padding: 9px;
  box-shadow: 0 12px 18px #283c2825;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card h3 {
  font-size: 23px;
  line-height: 1.05;
}
.card p {
  font: 16px/1.35 Georgia;
  background: #fff3d9;
  padding: 9px;
  min-height: 60px;
}
.cost {
  font-size: 11px;
  letter-spacing: 1.5px;
  font-weight: bold;
  text-transform: uppercase;
}
.art {
  position: relative;
  height: 178px;
  overflow: hidden;
  isolation: isolate;
  display: grid;
  place-items: center;
  background:
    repeating-radial-gradient(
      circle at 53% 38%,
      transparent 0 13px,
      #ffebbd38 14px,
      transparent 15px 22px
    ),
    linear-gradient(160deg, var(--ink), #182d2d);
  border: 1px solid #393a2f;
}
.art:before,
.art:after {
  content: "";
  position: absolute;
  bottom: -68%;
  height: 108%;
  width: 115%;
  background: #1d3331;
  transform: rotate(32deg);
  border: 2px solid #c5ab76;
  z-index: -1;
}
.art:after {
  transform: rotate(-30deg);
  bottom: -73%;
  background: var(--ink);
}
.art b {
  font: 80px Georgia;
  color: #f9d995;
  text-shadow: 2px 3px #52452b;
  transform: translateY(-12px);
}
.art img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.tabs button,
.chip {
  padding: 6px 9px;
  font-size: 12px;
}
.muted {
  font-size: 13px;
  color: #506354;
}
.box {
  background: #fbfaf4;
  border: 1px solid #bdc5b6;
  border-radius: 10px;
}
.two {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}
.pair {
  display: flex;
  gap: 9px;
}
.pair > * {
  flex: 1;
  min-width: 0;
}
label {
  font-size: 13px;
  font-weight: 650;
  display: grid;
  gap: 4px;
}
input,
textarea,
select {
  width: 100%;
  min-width: 0;
  border: 1px solid #b1b9ab;
  border-radius: 5px;
  background: #fffefa;
  color: inherit;
  padding: 7px;
}
textarea {
  min-height: 90px;
  font: 14px/1.5 monospace;
}
fieldset {
  border: 1px solid #c6ccbc;
  border-radius: 6px;
  margin: 0;
  padding: 9px;
}
legend {
  font-size: 12px;
}
.pieces {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.battle {
  border-radius: 10px;
  padding: 23px;
  background-position: center;
}
.hand {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.hand button {
  flex: 0 1 158px;
  min-height: 78px;
  border-top: 5px solid var(--ink);
  text-align: left;
}
.hand span {
  display: block;
  font-size: 12px;
  font-weight: 400;
}
.dim {
  opacity: 0.67;
}
.log {
  max-height: 180px;
  overflow: auto;
  background: #faf8ef;
  padding: 10px 10px 10px 35px;
}
.zones {
  display: flex;
  gap: 8px;
  margin: 12px 0;
  flex-wrap: wrap;
}
.zone {
  background: #f5f4e8db;
  padding: 8px 12px;
  border: 1px dashed #71836d;
  border-radius: 6px;
}
details {
  padding: 7px 0;
}
summary {
  cursor: pointer;
  font-weight: 650;
}
.guide {
  background: #e7ebdc;
  border-left: 3px solid #658269;
  padding: 11px 14px;
  margin-top: 12px;
  font-size: 13px;
}
dialog {
  max-width: min(530px, 96vw);
  width: 510px;
  border: 1px solid #9daf9a;
  border-radius: 10px;
  color: inherit;
  background: #fcfaf4;
  padding: 22px;
}
dialog::backdrop {
  background: #1b302c88;
}
#close {
  float: right;
}
#inside {
  padding-right: 20px;
}
#status:not(:empty) {
  padding: 8px 14px;
  background: #fff0c6;
  margin-bottom: 12px;
  border-radius: 5px;
}
.bench {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
.bench td,
.bench th {
  border-bottom: 1px solid #c3cabb;
  padding: 8px;
}
.box p {
  margin: 6px 0;
}
hr {
  border: 0;
  border-top: 1px solid #ccd1c1;
  margin: 15px 0;
}
@media (max-width: 920px) {
  .work {
    grid-template-columns: 1fr 1fr;
  }
  .library {
    grid-column: 1/-1;
  }
  .library .stack {
    display: flex;
    flex-wrap: wrap;
  }
  .item {
    width: auto;
  }
  .stage {
    min-height: 360px;
  }
}
@media (max-width: 650px) {
  header {
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 3vw;
  }
  header nav {
    order: 3;
    width: 100%;
    margin: 0;
    overflow: auto;
  }
  #help {
    margin-left: auto;
  }
  main {
    padding: 16px 3vw;
  }
  .work,
  .two {
    display: flex;
    flex-direction: column;
  }
  .stage {
    min-height: 300px;
  }
  .card {
    width: 190px;
  }
  .art {
    height: 110px;
  }
  .library,
  .inspector {
    padding: 13px;
  }
  .mini {
    width: 22px;
    height: 27px;
  }
  .library .stack {
    gap: 2px;
  }
  .item {
    padding: 4px;
  }
  .bench {
    font-size: 12px;
  }
}
.hand .box {
  padding: 10px 14px;
}
.unitzone {
  min-width: 120px;
  border: 1px dashed #87957b;
  padding: 6px 10px;
}
.unitzone .hand:empty {
  display: none;
}

/* Shared workshop shell and full-width dueling table */
:root{--slate:#182329;--edge:#435052;--text:#e9e5d9;--brass:#edc888;--turq:#91d1b5}
body{background:#101a1e;color:var(--text);font-family:Inter,"Helvetica Neue",Arial,sans-serif}
header{background:#111b20;border-bottom:1px solid #48514b;padding:9px 2vw}
header strong{font-size:23px}header nav button{padding:11px 17px}header nav .on{box-shadow:inset 0 -2px var(--brass)}
main{max-width:none;padding:20px 2vw}.top{margin-bottom:16px}.top h1{font-size:36px}small{color:var(--brass)}
button,select,input,textarea{color:var(--text);background:#243339;border:1px solid #495656}
button:hover,.tabs .on,.item.on,header nav button.on{background:#324841;color:#fff7df;border-color:#819181}.primary,.primary:hover{background:#e5be7b;color:#22291f;border-color:#d8b77f}
.work,.box,dialog{background:#1b282d;border-color:var(--edge);color:var(--text)}
.work{grid-template-columns:minmax(180px,20%) minmax(270px,1fr) minmax(255px,28%);min-height:66vh}
.library,.inspector{border-color:var(--edge);padding:clamp(12px,1.65vw,29px)}.mini{width:43px;height:51px;background-size:cover;background-position:center;color:transparent;flex-shrink:0}.item{padding:6px}.item.on{box-shadow:inset 3px 0 #d8bb85}
.stage,.duelLobby{background:radial-gradient(ellipse at 50% 42%,#40534d 0%,#293936 38%,#111d21 88%);position:relative;isolation:isolate}
.stage:before,.duelLobby:before{content:"";position:absolute;inset:18px;border:1px solid #d6bc7a32;pointer-events:none;z-index:-1}.stage .card{width:clamp(235px,22vw,330px)}
.card{background:linear-gradient(135deg,#575345,#272c2d 22%,var(--ink) 70%,#242a27);border:4px solid #171d1e;box-shadow:inset 0 0 0 1px #cfb783,0 8px 18px #0007;color:#fff1d7;padding:7px;gap:4px;text-align:left;max-width:100%}
.card h3{padding:3px 4px;font:600 clamp(15px,1.45vw,24px)/1.1 Georgia,serif;overflow-wrap:anywhere}.art{height:auto;aspect-ratio:1.36;border:1px solid #ac966d}.art img{object-fit:cover}.cost{color:#f5e6bf;font-size:10px;letter-spacing:.8px;padding:2px 4px}.card p{background:#e8dfc9;color:#282c29;border:1px solid #b9a784;font:15px/1.3 Georgia,serif;overflow-wrap:anywhere}
.box details,.zone,fieldset{border-color:#526263}.zone,.guide{background:#2a393a;color:var(--text)}.guide{border-color:var(--brass)}.muted{color:#b5c5c2}a{color:#afdccf}
.two{grid-template-columns:minmax(320px,.9fr) minmax(340px,1.1fr)}.two .box h2,.inspector h2,.box h2{color:var(--brass)}.box details{background:#233034;padding:13px;margin-top:9px;border:1px solid #40514d;border-radius:6px}#status:not(:empty){background:#493e2c;color:#fff1ce}
body[data-mode="Playtest"] main{padding:0}body[data-mode="Playtest"] .top{display:none}body[data-mode="Playtest"] #status:not(:empty){margin:0}.arena,.duelLobby{min-height:calc(100dvh - 66px)}
.duelLobby{display:flex;align-items:center;justify-content:center;gap:6vw;padding:6vw;overflow:hidden}.duelLobby h2{font-size:clamp(42px,6vw,85px)}.duelLobby p{margin:8px 0 22px;color:#c4cec7}.lobbyCards{display:flex;align-items:center;padding:5%}.lobbyCards .card{width:clamp(110px,14vw,250px);margin-left:-7%;transform:rotate(-7deg)}.lobbyCards .card:last-child{transform:rotate(9deg)}
.arena{position:relative;display:grid;grid-template-rows:auto minmax(150px,1fr) auto minmax(150px,1fr) auto auto;gap:0;background:linear-gradient(#101b22a8,#17282bc9),var(--field-image,radial-gradient(ellipse at center,#687264,#263c3d 60%,#18262a));background-size:cover;background-position:center}
.arenaTools,.handbar,.controls,.portrait,.resolution{display:flex;align-items:center;gap:10px}.arenaTools,.handbar{padding:6px 2vw;justify-content:space-between;background:#142226e8;border-bottom:1px solid #74816a55}.controls{flex-wrap:wrap}.controls label{display:flex;align-items:center;gap:6px}.controls select{width:auto}.arenaTools strong{margin-left:8px}.seat{display:grid;grid-template-columns:minmax(105px,12%) minmax(0,1fr) minmax(72px,7%);align-items:center;padding:7px 2vw;gap:12px}
.portrait{align-self:center;flex-wrap:wrap}.avatar{font:28px Georgia;color:var(--brass);border:1px solid #93805d;border-radius:50%;padding:4px 10px;background:#12252a}.vitals{color:#f1d297;font-weight:bold}.rail{display:grid;gap:6px;color:#cbd5cc;text-transform:capitalize;font-size:13px}.pile{padding:6px}.fieldcards,.cardhand{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}.fieldcards{padding:9px 12px;min-height:145px;align-items:center;border-block:1px solid #dccc9b22}
.tablecard{appearance:none;display:block;position:relative;background:none!important;padding:0;border:0;color:inherit;flex:0 0 auto;user-select:none;-webkit-touch-callout:none}.tablecard .card{width:100%;height:100%;border-width:3px;padding:4px;gap:2px}.tablecard .card h3{font-size:clamp(14px,1.25vw,21px)}.tablecard .card p{min-height:35px;font:13px/1.2 Georgia,serif;padding:5px}.fieldcards .tablecard{width:clamp(135px,12vw,205px)}.fieldcards .card p{display:none}.fieldcards .art{aspect-ratio:1.85}.resting .card,.resting .cardback{transform:rotate(4deg);filter:saturate(.75)}.unitstat{display:block;border:1px solid #7c836b;border-radius:8px;background:#1a2929;color:#f2e2b8;padding:2px 6px;font-size:12px}
.resolution{justify-content:center;min-height:34px;padding:4px 18px;background:#121e22c9;border-block:1px solid #99895b66;font-size:14px}.resolveCard{color:var(--brass);padding:3px 7px}.handbar{border-top:1px solid #cbb78277}.handbar>div{display:flex;gap:8px;align-items:center}.cardhand{background:linear-gradient(#222f2f,#101a1f);padding:10px 2vw 12px;min-height:150px}.cardhand .tablecard{width:clamp(150px,13vw,210px)}.cardhand .art{aspect-ratio:1.75}.cardhand .card p{max-height:58px;overflow:hidden}.playable{border-radius:12px;box-shadow:0 0 0 1px #adc8a1}.unavailable{filter:saturate(.65)}.tablecard:hover{z-index:1;filter:brightness(1.12)}
.logDrawer{position:absolute;z-index:4;top:49px;right:1vw;width:min(370px,60vw);max-height:70vh;overflow:auto;background:#192529f5;border:1px solid #9b8e6d;border-radius:9px;padding:15px;box-shadow:0 12px 30px #0008}.logDrawer li{padding:5px;border-bottom:1px solid #45524a}.cardback{aspect-ratio:1.02;display:grid;place-items:center;border:6px double #b29a68;border-radius:9px;color:#e7ce96;background:repeating-linear-gradient(45deg,#27383d 0 4px,#213033 4px 8px)}.cardback span{border:1px solid #ab956c;font:40px Georgia;padding:3px 16px;transform:rotate(5deg)}
dialog:has(.inspectCard){background:#142029;max-height:95dvh;width:min(460px,80vw);overflow:auto}.inspectCard{display:grid;place-items:center}.inspectCard .card{width:min(365px,100%)}.inspectCard .art{aspect-ratio:1.1}.inspectCard .art img{object-fit:contain;background:#141c1c}.inspectCard .card p{max-height:none}.inspectCard h3{font-size:27px}
.motion-play,.resolveCard{animation:play-in .45s ease-out}.motion-set{animation:set-down .48s ease-out}.motion-flip{animation:flip-up .55s ease}.motion-attack{animation:strike-motion .55s ease}.seat1 .motion-attack{--lunge:20px}.seat0 .motion-attack{--lunge:-20px}.motion-attack .card{animation:tap-card .55s ease}
@keyframes play-in{from{opacity:.15;transform:translateY(-14px) scale(.85)}}@keyframes set-down{from{opacity:.2;transform:perspective(450px) rotateX(58deg) translateY(-20px)}}@keyframes flip-up{from{transform:perspective(600px) rotateY(89deg)}}@keyframes strike-motion{40%{transform:translateY(var(--lunge)) scale(1.06)}}@keyframes tap-card{from{transform:rotate(0)}to{transform:rotate(4deg)}}
@media(min-width:700px) and (max-width:920px){.work{grid-template-columns:160px minmax(225px,1fr) 245px}.library{grid-column:auto}.library .stack{display:grid}.item{width:100%}.seat{grid-template-columns:100px 1fr 66px;padding-inline:10px}.work .stage .card{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.spotlight{position:absolute;z-index:2;left:1.2vw;top:47%;transform:translateY(-50%);width:clamp(80px,8vw,130px)}.spotlight .tablecard{width:100%}.spotlight .art{aspect-ratio:2}.spotlight .card p{display:none}.spotlight .card h3{font-size:13px}.spotlight .cost{font-size:8px}.spotlight.motion-play{animation:spotlight-in .6s ease-out}@keyframes spotlight-in{from{opacity:0;transform:translateY(-85%) rotate(-8deg)}}@media(max-height:740px){.spotlight{left:auto;right:1vw;top:44%;width:74px}}

    <header>
      <div class="mark" aria-hidden="true">✣</div>
      <strong>Card Game Creator</strong>
      <nav id="modes"></nav>
      <button id="help">? &nbsp; Help</button>
    </header>
    <main>
      <section class="top">
        <div>
          <small>MODULE WORKSHOP</small>
          <h1 id="title"></h1>
        </div>
        <div class="actions">
          <button id="new">＋ New</button><button id="open">Import ZIP</button
          ><button id="save">Export ZIP ↓</button>
        </div>
      </section>
      <div id="status" role="status"></div>
      <div id="root"></div>
    </main>
    <dialog id="dialog">
      <button id="close" aria-label="Close dialog">×</button>
      <div id="inside"></div>
    </dialog>
    <input type="file" accept=".zip" hidden id="zip" />

function parse(source) {
  const lines = source.trim().split(/\n/);
  if (lines.length > 24) throw Error("Use up to 24 instructions per card.");
  return lines.map((line, i) => {
    const m =
      /^\s*(?:(if_life_below|if_energy_at_least)\s+(\d{1,2})\s+)?(strike|mend|draw|charge)\s+(\d{1,2})\s*$/.exec(
        line,
      );
    if (!m)
      throw Error(
        "Line " + (i + 1) + " needs an effect and an amount from 0 to 99.",
      );
    return { when: m[1], limit: Number(m[2]), op: m[3], n: Number(m[4]) };
  });
}

    t.oncomplete = ok;
    t.onabort = t.onerror = () => no(t.error);

async function dispatch(action, v) {
  const c = current();
  if (
    dirty &&
    [
      "tab",
      "mode",
      "select",
      "try",
      "add",
      "switch",
      "blank",
      "starter",
      "duplicate",
      "ask-delete",
      "challenges",
    ].includes(action)
  ) {
    status("Apply the script or discard your draft before leaving.");
    return;
  }
  switch (action) {
    case "mode":
      mode = v;
      break;
    case "challenges":
      onboarding();
      return;
    case "tab":
      tab = v;
      break;
    case "select":
      selected = v;
      break;
    case "add": {
      const x = card("New card " + (m.cards.length + 1), m.cards.length);
      if (m.cards.length >= 500) throw Error("Catalog limit reached.");
      m.cards.push(x);
      selected = x.id;
      tab = "Place";
      edited();
      return;
    }
    case "duplicate": {
      if (m.cards.length >= 500) throw Error("Catalog limit reached.");
      const x = structuredClone(c);
      x.id = uid();
      x.name += " copy";
      m.cards.push(x);
      selected = x.id;
      edited();
      return;
    }
    case "ask-delete":
      modal(
        "<h2>Remove this card?</h2><p>" +
          esc(c.name) +
          " will be removed from both decks.</p>" +
          button("delete", "Remove card"),
      );
      return;
    case "delete":
      m.cards = m.cards.filter((x) => x.id !== selected);
      for (const d of m.decks) delete d[selected];
      selected = m.cards[0]?.id;
      $("dialog").close();
      edited();
      return;
    case "effect":
      c.script = v + " " + (v === "draw" ? 1 : 2);
      edited();
      return;
    case "add-attack":
      if (c.attacks.length < 4)
        c.attacks.push({ name: "Heavy hit", cost: 2, power: 4 });
      edited();
      return;
    case "inspect":inspect(v);return;
    case "unknown":status("George’s face-down unit has 2 base HP. Its identity is hidden.");return;
    case "log":logOpen=!logOpen;break;
    case "step":nextBot();return;
    case "pile":modal('<h2>Discard pile</h2><div class="stack">'+(s.players[+v].discard.map(id=>button('inspect',byId(id).name,'',id)).join('')||'Empty')+'</div>');return;
    case "unit":{
      const u=s.players[0].field[+v],card=byId(u.id);
      const can=u.ready&&!s.pending&&s.actor===0&&s.turn===0&&s.winner===null;
      modal('<h2>'+esc(card.name)+'</h2><p>'+u.hp+' HP · '+(u.ready?'Ready':'Resting')+'</p><div class="stack">'+button('inspect','Inspect card','',card.id)+(can?(u.hidden?button('flip','Reveal unit','primary',v):card.attacks.map((a,j)=>button('target',a.name+' · '+a.power+' damage · '+a.cost+' energy','',''+v+':'+j)).join('')):'')+'</div>');return;
    }
    case "flip":{const prev=structuredClone(s);reveal(m,s,0,+v);history.push(prev);$("dialog").close();break;}
    case "target":{
      const [i,j]=v.split(":").map(Number),a=byId(s.players[0].field[i].id).attacks[j];
      if(a.cost>s.players[0].energy){modal("<h2>Insufficient energy</h2><p>This attack costs "+a.cost+" energy.</p>");return}
      const q=s.players[1],targets=legalTargets(m,s,0);
      modal('<h2>'+esc(a.name)+'</h2><p>Choose a target · '+a.power+' damage</p><div class="stack">'+targets.map(t=>{
        const hp=t===-1?q.life:q.field[t].hp;
        const name=t===-1?"George Card":q.field[t].hidden?"Face-down unit":byId(q.field[t].id).name;
        return button("attack",name+" · "+hp+" → "+Math.max(0,hp-a.power)+(t===-1?" life":" HP"),"",v+":"+t);
      }).join("")+'</div>');return;
    }
    case "attack": {
      const prev = structuredClone(s);
      $("dialog").close();
      attack(m, s, 0, ...v.split(":").map(Number));
      history.push(prev);

      break;
    }
    case "append":
      if (parse(c.script).length >= 24) throw Error("Maximum 24 instructions.");
      c.script += "\nstrike 1";
      edited();
      return;
    case "remove-line": {
      const xs = parse(c.script);
      xs.splice(Number(v), 1);
      c.script = linesToScript(xs);
      edited();
      return;
    }
    case "apply":
      parse($("source").value);
      c.script = $("source").value.trim();
      edited();
      status("Script applied.");
      return;
    case "discard":
      dirty = false;
      break;
    case "up":
    case "down": {
      const [key, n] = v.split(":");
      move(key, +n, +n + (action === "up" ? -1 : 1));
      return;
    }
    case "duel":
      launch();
      return;
    case "try":
      launch(true);
      return;
    case "replay":
      launch(false, false);
      return;
    case "use":
    case "pass": {
      if (action === "use") {
        const why = reason(m, s, 0, +v);
        if (why) {
          status(why);
          return;
        }
      }
      history.push(structuredClone(s));
      if (action === "use") act(m, s, 0, +v);
      else pass(m, s, 0);

      break;
    }
    case "rewind":
      if (history.length) s = history.pop();
      break;
    case "guide":
      guide = !guide;
      localStorage.setItem("cgc-guide", String(guide));
      $("dialog").close();
      break;
    case "blank":
    case "starter":
      load(moduleData(action === "blank"));
      $("dialog").close();
      return;
    case "switch": {
      const list = await collection();
      load(list.find((x) => x.id === v));
      $("dialog").close();
      return;
    }
  }
  render();
}

function clearPress(){clearTimeout(pressTimer);pressStart=null}
root.addEventListener("contextmenu",e=>{const el=e.target.closest("[data-card]");if(el){e.preventDefault();inspect(el.dataset.card)}});
root.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-card]");if(!el||e.pointerType==="mouse")return;clearPress();pressStart=[e.clientX,e.clientY];pressTimer=setTimeout(()=>{suppressClick=performance.now()+1000;inspect(el.dataset.card)},500)});
root.addEventListener("pointermove",e=>{if(pressStart&&Math.hypot(e.clientX-pressStart[0],e.clientY-pressStart[1])>10)clearPress()});
for(const event of ["pointerup","pointercancel"])document.addEventListener(event,clearPress);
document.addEventListener("click", (e) => {
  if(performance.now()<suppressClick){e.preventDefault();return}
  const b = e.target.closest("[data-action]");
  if (b) {
    status();
    dispatch(b.dataset.action, b.dataset.v).catch((err) => status(err.message));
  }
});
root.oninput = (e) => {
  if (e.target.id === "source") {
    dirty = true;
    if (!$("discardDraft")) {
      const b = document.createElement("button");
      b.id = "discardDraft";
      b.dataset.action = "discard";
      b.textContent = "Discard script draft";
      e.target.parentNode.after(b);
    }
  }
};
root.onchange = async (e) => {
  if(e.target.id==="pace"){pace=e.target.value;try{localStorage.setItem("cgc-pace",pace)}catch{} render();return;}
  const el = e.target,
    k = el.dataset.key,
    backup = structuredClone(m);
  try {
    if (el.dataset.image) {
      const file = el.files[0];
      if (!file) return;
      if (
        !["image/png", "image/jpeg", "image/webp"].includes(file.type) ||
        file.size > 2 * 1024 * 1024
      )
        throw Error("Choose a PNG, JPEG or WebP up to 2 MB.");
      const obj = el.dataset.image === "art" ? current() : m,
        original = m;
      const data = await new Promise((ok, no) => {
        const r = new FileReader();
        r.onload = () => ok(r.result);
        r.onerror = no;
        r.readAsDataURL(file);
      });
      if (m !== original) return;
      obj[el.dataset.image] = data;
      edited();
      return;
    }
    if (!k) return;
    if (!el.checkValidity())
      throw Error("Enter a value in the displayed range.");
    const value =
        el.type === "number" || k === "glyph"
          ? Number(el.value)
          : el.value.trim(),
      c = current();
    if (k === "module") m.name = value;
    else if (Object.hasOwn(m.rules, k)) m.rules[k] = value;
    else if(k==="guard") c.guard=value==="yes";
    else if (k.startsWith("attack:")) {
      const [, i, prop] = k.split(":");
      c.attacks[i][prop] = value;
    } else if (k.startsWith("deck:")) {
      const [, p, id] = k.split(":");
      m.decks[p][id] = value;
    } else if (k.includes(":")) {
      const [prop, i] = k.split(":"),
        xs = parse(c.script);
      xs[i][prop] = value;
      c.script = linesToScript(xs);
    } else c[k] = value;
    edited();
  } catch (err) {
    m = backup;
    render();
    status(err.message);
  }
};
root.ondragstart = (e) => {
  const el = e.target.closest("[draggable=true]");
  if (el)
    e.dataTransfer.setData(
      "text/plain",
      JSON.stringify(
        el.dataset.effect
          ? { effect: el.dataset.effect }
          : { key: el.dataset.order, i: +el.dataset.index },
      ),
    );
};
root.ondragover = (e) => {
  if (e.target.closest("#drop,[data-order]")) e.preventDefault();
};
root.ondrop = (e) => {
  e.preventDefault();
  try {
    const data = JSON.parse(e.dataTransfer.getData("text/plain")),
      row = e.target.closest("[data-order]");
    if (row && data.key === row.dataset.order && Number.isInteger(data.i))
      move(data.key, data.i, +row.dataset.index);
    else if (
      tab === "Place" &&
      e.target.closest("#drop") &&
      Object.hasOwn(effects, data.effect)
    )
      dispatch("effect", data.effect);
  } catch {}
};
$("help").onclick = () =>
  modal(
    '<h2>Workshop help</h2><div class="stack"><p>Place an effect, try the card, then edit the rule and play again.</p><a href="help.html" target="_blank">Open the workshop handbook ↗</a>' +
      button("challenges", "Open design challenges") +
      button("guide", guide ? "Hide George’s hints" : "Show George’s hints") +
      "</div>",
  );
$("new").onclick = async () => {
  if (dirty) {
    status("Apply or discard your script draft first.");
    return;
  }
  let list = [];
  try {
    list = await collection();
  } catch {}
  modal(
    '<h2>Modules</h2><div class="stack">' +
      button("blank", "＋ Blank module", "primary") +
      button("starter", "Create a starter duel") +
      "<h3>Saved in this browser</h3>" +
      list.map((x) => button("switch", x.name, "", x.id)).join("") +
      "</div>",
  );
};
$("open").onclick = () => {
  if (dirty) {
    status("Apply or discard your script draft first.");
    return;
  }
  $("zip").click();
};
$("zip").onchange = async (e) => {
  try {
    const file = e.target.files[0];
    if (file) {
      const x = await unpack(file);
      x.id = uid();
      load(x);
      status("Module imported as an independent copy.");
    }
  } catch (err) {
    status(err.message);
  } finally {
    e.target.value = "";
  }
};
$("save").onclick = async () => {
  try {
    if (dirty) throw Error("Apply or discard your script draft before export.");
    const blob = await pack(m),
      url = URL.createObjectURL(blob),
      a = document.createElement("a");
    a.href = url;
    a.download = (m.name.replace(/[^a-z0-9_-]/gi, "-") || "module") + ".zip";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (err) {
    status(err.message);
  }
};
try {
  guide = localStorage.getItem("cgc-guide") !== "false";
  const list = await collection(),
    saved = list.find((x) => x.id === localStorage.getItem("cgc-current"));
  if (saved) {
    m = validate(saved);
    selected = m.cards[0]?.id;
  }
} catch {
  status("Browser storage unavailable. Use ZIP export to save.");
}
persist();
render();
