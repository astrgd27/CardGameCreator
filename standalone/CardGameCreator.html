<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#162d29" />
    <title>Card Game Creator · Workshop</title>
    <style>* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #f4f1e8;
  color: #24342f;
  font:
    15px/1.45 "DM Sans",
    system-ui,
    sans-serif;
}
header {
  display: flex;
  align-items: center;
  gap: 13px;
  background: #19332f;
  color: #fff7e8;
  padding: 13px 4vw;
  border-bottom: 3px solid #c89554;
}
header strong {
  font: 600 21px Georgia;
  letter-spacing: -0.6px;
}
.mark {
  font: 32px Georgia;
  color: #eab779;
}
header nav {
  margin: auto;
  display: flex;
  gap: 5px;
}
input,
select,
textarea,
button {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
  background: #fffdf6;
  border: 1px solid #b8bdb1;
  padding: 8px 13px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 14px;
}
button:hover {
  border-color: #365a49;
  background: #e7edde;
}
button:focus-visible,
summary:focus-visible {
  outline: 3px solid #d28438;
  outline-offset: 2px;
}
header button {
  background: transparent;
  color: inherit;
  border-color: transparent;
}
header button:hover,
header button.on {
  background: #38574a;
  color: white;
}
#help {
  border-color: #70847a;
}
.primary {
  background: #2a5044;
  color: white;
  border-color: #2a5044;
}
.primary:hover {
  background: #406950;
}
main {
  max-width: 1570px;
  margin: auto;
  padding: 28px 4vw;
}
.top,
.line,
.actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  flex-wrap: wrap;
}
.top {
  margin-bottom: 23px;
}
small {
  font-size: 10px;
  letter-spacing: 1.8px;
  font-weight: 800;
  color: #516354;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-family: Georgia, serif;
  font-weight: normal;
}
h1 {
  font-size: clamp(34px, 4vw, 54px);
  line-height: 1.13;
}
h2 {
  font-size: 25px;
}
h3 {
  font-size: 19px;
}
.work {
  display: grid;
  grid-template-columns: minmax(175px, 0.85fr) minmax(275px, 1.65fr) minmax(
      250px,
      1.1fr
    );
  border: 1px solid #b9c1b2;
  background: #fcfaf4;
  border-radius: 12px;
  overflow: hidden;
}
.library,
.inspector,
.box {
  padding: 19px;
}
.library {
  border-right: 1px solid #c1c7bb;
}
.inspector {
  border-left: 1px solid #c1c7bb;
}
.stack {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}
.item {
  width: 100%;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  background: transparent;
  border: 1px solid transparent;
  padding: 8px;
}
.item.on,
.tabs .on {
  background: #dde7d7;
  border-color: #9ead97;
}
.mini {
  width: 30px;
  height: 38px;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: #ffe7ae;
  font: 23px Georgia;
  border: 2px solid #253b32;
  border-radius: 3px;
}
.stage,
.battle {
  background-color: #dbe2d3;
  background-image: radial-gradient(#a9b7a4 0.85px, transparent 0.85px);
  background-size: 13px 13px;
}
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  min-height: 465px;
  padding: 26px 10px;
}
.stage small {
  letter-spacing: 2px;
}
.card {
  background: #f1deaf;
  color: #332e23;
  border: 6px solid #2c342a;
  border-radius: 14px;
  width: min(245px, 96%);
  padding: 9px;
  box-shadow: 0 12px 18px #283c2825;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card h3 {
  font-size: 23px;
  line-height: 1.05;
}
.card p {
  font: 16px/1.35 Georgia;
  background: #fff3d9;
  padding: 9px;
  min-height: 60px;
}
.cost {
  font-size: 11px;
  letter-spacing: 1.5px;
  font-weight: bold;
  text-transform: uppercase;
}
.art {
  position: relative;
  height: 178px;
  overflow: hidden;
  isolation: isolate;
  display: grid;
  place-items: center;
  background:
    repeating-radial-gradient(
      circle at 53% 38%,
      transparent 0 13px,
      #ffebbd38 14px,
      transparent 15px 22px
    ),
    linear-gradient(160deg, var(--ink), #182d2d);
  border: 1px solid #393a2f;
}
.art:before,
.art:after {
  content: "";
  position: absolute;
  bottom: -68%;
  height: 108%;
  width: 115%;
  background: #1d3331;
  transform: rotate(32deg);
  border: 2px solid #c5ab76;
  z-index: -1;
}
.art:after {
  transform: rotate(-30deg);
  bottom: -73%;
  background: var(--ink);
}
.art b {
  font: 80px Georgia;
  color: #f9d995;
  text-shadow: 2px 3px #52452b;
  transform: translateY(-12px);
}
.art img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.tabs button,
.chip {
  padding: 6px 9px;
  font-size: 12px;
}
.muted {
  font-size: 13px;
  color: #506354;
}
.box {
  background: #fbfaf4;
  border: 1px solid #bdc5b6;
  border-radius: 10px;
}
.two {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}
.pair {
  display: flex;
  gap: 9px;
}
.pair > * {
  flex: 1;
  min-width: 0;
}
label {
  font-size: 13px;
  font-weight: 650;
  display: grid;
  gap: 4px;
}
input,
textarea,
select {
  width: 100%;
  min-width: 0;
  border: 1px solid #b1b9ab;
  border-radius: 5px;
  background: #fffefa;
  color: inherit;
  padding: 7px;
}
textarea {
  min-height: 90px;
  font: 14px/1.5 monospace;
}
fieldset {
  border: 1px solid #c6ccbc;
  border-radius: 6px;
  margin: 0;
  padding: 9px;
}
legend {
  font-size: 12px;
}
.pieces {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.battle {
  border-radius: 10px;
  padding: 23px;
  background-position: center;
}
.hand {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.hand button {
  flex: 0 1 158px;
  min-height: 78px;
  border-top: 5px solid var(--ink);
  text-align: left;
}
.hand span {
  display: block;
  font-size: 12px;
  font-weight: 400;
}
.dim {
  opacity: 0.67;
}
.log {
  max-height: 180px;
  overflow: auto;
  background: #faf8ef;
  padding: 10px 10px 10px 35px;
}
.zones {
  display: flex;
  gap: 8px;
  margin: 12px 0;
  flex-wrap: wrap;
}
.zone {
  background: #f5f4e8db;
  padding: 8px 12px;
  border: 1px dashed #71836d;
  border-radius: 6px;
}
details {
  padding: 7px 0;
}
summary {
  cursor: pointer;
  font-weight: 650;
}
.guide {
  background: #e7ebdc;
  border-left: 3px solid #658269;
  padding: 11px 14px;
  margin-top: 12px;
  font-size: 13px;
}
dialog {
  max-width: min(530px, 96vw);
  width: 510px;
  border: 1px solid #9daf9a;
  border-radius: 10px;
  color: inherit;
  background: #fcfaf4;
  padding: 22px;
}
dialog::backdrop {
  background: #1b302c88;
}
#close {
  float: right;
}
#inside {
  padding-right: 20px;
}
#status:not(:empty) {
  padding: 8px 14px;
  background: #fff0c6;
  margin-bottom: 12px;
  border-radius: 5px;
}
.bench {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
.bench td,
.bench th {
  border-bottom: 1px solid #c3cabb;
  padding: 8px;
}
.box p {
  margin: 6px 0;
}
hr {
  border: 0;
  border-top: 1px solid #ccd1c1;
  margin: 15px 0;
}
@media (max-width: 920px) {
  .work {
    grid-template-columns: 1fr 1fr;
  }
  .library {
    grid-column: 1/-1;
  }
  .library .stack {
    display: flex;
    flex-wrap: wrap;
  }
  .item {
    width: auto;
  }
  .stage {
    min-height: 360px;
  }
}
@media (max-width: 650px) {
  header {
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 3vw;
  }
  header nav {
    order: 3;
    width: 100%;
    margin: 0;
    overflow: auto;
  }
  #help {
    margin-left: auto;
  }
  main {
    padding: 16px 3vw;
  }
  .work,
  .two {
    display: flex;
    flex-direction: column;
  }
  .stage {
    min-height: 300px;
  }
  .card {
    width: 190px;
  }
  .art {
    height: 110px;
  }
  .library,
  .inspector {
    padding: 13px;
  }
  .mini {
    width: 22px;
    height: 27px;
  }
  .library .stack {
    gap: 2px;
  }
  .item {
    padding: 4px;
  }
  .bench {
    font-size: 12px;
  }
}
.hand .box {
  padding: 10px 14px;
}
.unitzone {
  min-width: 120px;
  border: 1px dashed #87957b;
  padding: 6px 10px;
}
.unitzone .hand:empty {
  display: none;
}

/* Shared workshop shell and full-width dueling table */
:root{--slate:#182329;--edge:#435052;--text:#e9e5d9;--brass:#edc888;--turq:#91d1b5}
body{background:#101a1e;color:var(--text);font-family:Inter,"Helvetica Neue",Arial,sans-serif}
header{background:#111b20;border-bottom:1px solid #48514b;padding:9px 2vw}
header strong{font-size:23px}header nav button{padding:11px 17px}header nav .on{box-shadow:inset 0 -2px var(--brass)}
main{max-width:none;padding:20px 2vw}.top{margin-bottom:16px}.top h1{font-size:36px}small{color:var(--brass)}
button,select,input,textarea{color:var(--text);background:#243339;border:1px solid #495656}
button:hover,.tabs .on,.item.on,header nav button.on{background:#324841;color:#fff7df;border-color:#819181}.primary,.primary:hover{background:#e5be7b;color:#22291f;border-color:#d8b77f}
.work,.box,dialog{background:#1b282d;border-color:var(--edge);color:var(--text)}
.work{grid-template-columns:minmax(180px,20%) minmax(270px,1fr) minmax(255px,28%);min-height:66vh}
.library,.inspector{border-color:var(--edge);padding:clamp(12px,1.65vw,29px)}.mini{width:43px;height:51px;background-size:cover;background-position:center;color:transparent;flex-shrink:0}.item{padding:6px}.item.on{box-shadow:inset 3px 0 #d8bb85}
.stage,.duelLobby{background:radial-gradient(ellipse at 50% 42%,#40534d 0%,#293936 38%,#111d21 88%);position:relative;isolation:isolate}
.stage:before,.duelLobby:before{content:"";position:absolute;inset:18px;border:1px solid #d6bc7a32;pointer-events:none;z-index:-1}.stage .card{width:clamp(235px,22vw,330px)}
.card{background:linear-gradient(135deg,#575345,#272c2d 22%,var(--ink) 70%,#242a27);border:4px solid #171d1e;box-shadow:inset 0 0 0 1px #cfb783,0 8px 18px #0007;color:#fff1d7;padding:7px;gap:4px;text-align:left;max-width:100%}
.card h3{padding:3px 4px;font:600 clamp(15px,1.45vw,24px)/1.1 Georgia,serif;overflow-wrap:anywhere}.art{height:auto;aspect-ratio:1.36;border:1px solid #ac966d}.art img{object-fit:cover}.cost{color:#f5e6bf;font-size:10px;letter-spacing:.8px;padding:2px 4px}.card p{background:#e8dfc9;color:#282c29;border:1px solid #b9a784;font:15px/1.3 Georgia,serif;overflow-wrap:anywhere}
.box details,.zone,fieldset{border-color:#526263}.zone,.guide{background:#2a393a;color:var(--text)}.guide{border-color:var(--brass)}.muted{color:#b5c5c2}a{color:#afdccf}
.two{grid-template-columns:minmax(320px,.9fr) minmax(340px,1.1fr)}.two .box h2,.inspector h2,.box h2{color:var(--brass)}.box details{background:#233034;padding:13px;margin-top:9px;border:1px solid #40514d;border-radius:6px}#status:not(:empty){background:#493e2c;color:#fff1ce}
body[data-mode="Playtest"] main{padding:0}body[data-mode="Playtest"] .top{display:none}body[data-mode="Playtest"] #status:not(:empty){margin:0}.arena,.duelLobby{min-height:calc(100dvh - 66px)}
.duelLobby{display:flex;align-items:center;justify-content:center;gap:6vw;padding:6vw;overflow:hidden}.duelLobby h2{font-size:clamp(42px,6vw,85px)}.duelLobby p{margin:8px 0 22px;color:#c4cec7}.lobbyCards{display:flex;align-items:center;padding:5%}.lobbyCards .card{width:clamp(110px,14vw,250px);margin-left:-7%;transform:rotate(-7deg)}.lobbyCards .card:last-child{transform:rotate(9deg)}
.arena{position:relative;display:grid;grid-template-rows:auto minmax(150px,1fr) auto minmax(150px,1fr) auto auto;gap:0;background:linear-gradient(#101b22a8,#17282bc9),var(--field-image,radial-gradient(ellipse at center,#687264,#263c3d 60%,#18262a));background-size:cover;background-position:center}
.arenaTools,.handbar,.controls,.portrait,.resolution{display:flex;align-items:center;gap:10px}.arenaTools,.handbar{padding:6px 2vw;justify-content:space-between;background:#142226e8;border-bottom:1px solid #74816a55}.controls{flex-wrap:wrap}.controls label{display:flex;align-items:center;gap:6px}.controls select{width:auto}.arenaTools strong{margin-left:8px}.seat{display:grid;grid-template-columns:minmax(105px,12%) minmax(0,1fr) minmax(72px,7%);align-items:center;padding:7px 2vw;gap:12px}
.portrait{align-self:center;flex-wrap:wrap}.avatar{font:28px Georgia;color:var(--brass);border:1px solid #93805d;border-radius:50%;padding:4px 10px;background:#12252a}.vitals{color:#f1d297;font-weight:bold}.rail{display:grid;gap:6px;color:#cbd5cc;text-transform:capitalize;font-size:13px}.pile{padding:6px}.fieldcards,.cardhand{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}.fieldcards{padding:9px 12px;min-height:145px;align-items:center;border-block:1px solid #dccc9b22}
.tablecard{appearance:none;display:block;position:relative;background:none!important;padding:0;border:0;color:inherit;flex:0 0 auto;user-select:none;-webkit-touch-callout:none}.tablecard .card{width:100%;height:100%;border-width:3px;padding:4px;gap:2px}.tablecard .card h3{font-size:clamp(14px,1.25vw,21px)}.tablecard .card p{min-height:35px;font:13px/1.2 Georgia,serif;padding:5px}.fieldcards .tablecard{width:clamp(135px,12vw,205px)}.fieldcards .card p{display:none}.fieldcards .art{aspect-ratio:1.85}.resting .card,.resting .cardback{transform:rotate(4deg);filter:saturate(.75)}.unitstat{display:block;border:1px solid #7c836b;border-radius:8px;background:#1a2929;color:#f2e2b8;padding:2px 6px;font-size:12px}
.resolution{justify-content:center;min-height:34px;padding:4px 18px;background:#121e22c9;border-block:1px solid #99895b66;font-size:14px}.resolveCard{color:var(--brass);padding:3px 7px}.handbar{border-top:1px solid #cbb78277}.handbar>div{display:flex;gap:8px;align-items:center}.cardhand{background:linear-gradient(#222f2f,#101a1f);padding:10px 2vw 12px;min-height:150px}.cardhand .tablecard{width:clamp(150px,13vw,210px)}.cardhand .art{aspect-ratio:1.75}.cardhand .card p{max-height:58px;overflow:hidden}.playable{border-radius:12px;box-shadow:0 0 0 1px #adc8a1}.unavailable{filter:saturate(.65)}.tablecard:hover{z-index:1;filter:brightness(1.12)}
.logDrawer{position:absolute;z-index:4;top:49px;right:1vw;width:min(370px,60vw);max-height:70vh;overflow:auto;background:#192529f5;border:1px solid #9b8e6d;border-radius:9px;padding:15px;box-shadow:0 12px 30px #0008}.logDrawer li{padding:5px;border-bottom:1px solid #45524a}.cardback{aspect-ratio:1.02;display:grid;place-items:center;border:6px double #b29a68;border-radius:9px;color:#e7ce96;background:repeating-linear-gradient(45deg,#27383d 0 4px,#213033 4px 8px)}.cardback span{border:1px solid #ab956c;font:40px Georgia;padding:3px 16px;transform:rotate(5deg)}
dialog:has(.inspectCard){background:#142029;max-height:95dvh;width:min(460px,80vw);overflow:auto}.inspectCard{display:grid;place-items:center}.inspectCard .card{width:min(365px,100%)}.inspectCard .art{aspect-ratio:1.1}.inspectCard .art img{object-fit:contain;background:#141c1c}.inspectCard .card p{max-height:none}.inspectCard h3{font-size:27px}
.motion-play,.resolveCard{animation:play-in .45s ease-out}.motion-set{animation:set-down .48s ease-out}.motion-flip{animation:flip-up .55s ease}.motion-attack{animation:strike-motion .55s ease}.seat1 .motion-attack{--lunge:20px}.seat0 .motion-attack{--lunge:-20px}.motion-attack .card{animation:tap-card .55s ease}
@keyframes play-in{from{opacity:.15;transform:translateY(-14px) scale(.85)}}@keyframes set-down{from{opacity:.2;transform:perspective(450px) rotateX(58deg) translateY(-20px)}}@keyframes flip-up{from{transform:perspective(600px) rotateY(89deg)}}@keyframes strike-motion{40%{transform:translateY(var(--lunge)) scale(1.06)}}@keyframes tap-card{from{transform:rotate(0)}to{transform:rotate(4deg)}}
@media(min-width:700px) and (max-width:920px){.work{grid-template-columns:160px minmax(225px,1fr) 245px}.library{grid-column:auto}.library .stack{display:grid}.item{width:100%}.seat{grid-template-columns:100px 1fr 66px;padding-inline:10px}.work .stage .card{width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.spotlight{position:absolute;z-index:2;left:1.2vw;top:47%;transform:translateY(-50%);width:clamp(80px,8vw,130px)}.spotlight .tablecard{width:100%}.spotlight .art{aspect-ratio:2}.spotlight .card p{display:none}.spotlight .card h3{font-size:13px}.spotlight .cost{font-size:8px}.spotlight.motion-play{animation:spotlight-in .6s ease-out}@keyframes spotlight-in{from{opacity:0;transform:translateY(-85%) rotate(-8deg)}}@media(max-height:740px){.spotlight{left:auto;right:1vw;top:44%;width:74px}}

/* Module home, creation navigation and dedicated deck workspace. */
.createNav{display:flex;gap:6px;border-bottom:1px solid #506159;padding-bottom:12px;margin-bottom:16px}
.createNav .on{border-color:#e3be77;background:#35453d}
.moduleHero{display:flex;justify-content:space-between;gap:30px;padding:3vw;background:radial-gradient(ellipse at right,#4d5845,#1b2e32 65%);border:1px solid #596558;border-radius:12px;margin-bottom:20px;min-height:260px;overflow:hidden}
.moduleHero h2{font-size:clamp(34px,4vw,65px);margin:12px 0}
.moduleHero p{max-width:600px;margin:12px 0 22px}
.heroCards{display:flex;align-items:center}
.heroCards .card{width:140px;transform:rotate(7deg);margin-left:-35px}
.heroCards .card p{display:none}
.deckToolbar{display:flex;align-items:end;gap:14px;flex-wrap:wrap;padding:15px;background:#1d2a30;border:1px solid #56615b;border-radius:10px;margin-bottom:15px}
.deckToolbar label{min-width:140px;flex:1}
.deckWorkspace{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr);gap:18px}
.deckFilters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:15px 0}
.deckFilters label:first-child{flex:1;min-width:170px}
.deckGallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;max-height:72vh;overflow:auto;padding:8px}
.deckChoice .tablecard{width:100%;margin-bottom:9px}
.deckChoice .card p{min-height:70px;max-height:120px;overflow:hidden}
.deckChoice .art{aspect-ratio:1.3}
.deckCompact{display:grid;gap:9px}
.deckCompact .deckChoice{display:flex;gap:12px;justify-content:space-between}
.deckRow{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #46544d;padding:5px 0}
.deckRow>button{border:0;background:none;text-align:left}
.deckRow .pieces{align-items:center;flex-wrap:nowrap}
.deckList{margin:20px 0;max-height:42vh;overflow:auto}
.deckList h3{color:#ebc889;margin:10px 0}
.curve{display:flex;align-items:end;gap:10px;height:110px;margin:8px 0}
.curve>div{flex:1;text-align:center;display:grid;align-content:end;font-size:12px}
.curve span{background:linear-gradient(#edcd88,#649e82);border-radius:3px;margin:3px}
.valid,.issue{padding:12px;margin:12px 0;border-radius:6px;background:#29483b}
.issue{background:#5c4030}
.tableWorkspace{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:20px}
#tableCanvas{height:470px;position:relative;border:1px solid #77816b;background:radial-gradient(#5c7062 1px,transparent 1px),#152a2d;background-size:15px 15px;margin:20px 0;overflow:hidden}
.canvasZone{position:absolute;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px dashed #bcc5a1;border-radius:8px;background:#344d4acc}
.canvasZone small{letter-spacing:0;text-transform:capitalize}
.canvasZone.selected{border:2px solid #e5c88c;background:#496350aa}
.liveTable{position:relative;min-height:220px;width:100%}
.liveZone{position:absolute;border:1px solid #aebd8e66;background:#172b2a44;padding:4px 8px;overflow:auto}
.liveZone>small{font-size:9px;letter-spacing:1px}
.liveZone .fieldcards{border:0;min-height:0;padding:3px}
.liveZone .fieldcards .tablecard{width:clamp(125px,11vw,180px)}
.arena .seat{align-items:stretch}
.arena .rail{align-content:center}
.deckWorkspace .box{min-width:0}
@media(max-width:1000px){
 .deckWorkspace{grid-template-columns:minmax(0,1fr) 300px}
 .tableWorkspace{grid-template-columns:minmax(0,1fr) 250px}
 .heroCards .card{width:100px}
 .deckToolbar{gap:8px}
}
@media(max-width:700px){
 .deckWorkspace,.tableWorkspace{display:block}
 .deckWorkspace>.box,.tableWorkspace>.box{margin-bottom:15px}
 .heroCards{display:none}
 .createNav{overflow:auto}
 .liveTable{min-height:200px}
}

#saveState{font-size:11px;color:#a7c7b8}

/* Arena milestone 1: card-first desktop/tablet layout. */
body[data-mode="Playtest"] { --arena-height:calc(100dvh - 66px); }
body[data-mode="Playtest"] .arena {
  grid-template-rows:auto minmax(180px,1fr) auto minmax(180px,1fr) auto auto;
  background-color:#101c24;
}
.arena .arenaTools {grid-column:1;grid-row:1}
.arena .seat1 {grid-column:1;grid-row:2}
.arena .resolution {grid-column:1;grid-row:3;min-height:48px;padding:8px 2vw;text-align:center;flex-wrap:wrap}
.arena .seat0 {grid-column:1;grid-row:4}
.arena .handbar {grid-column:1;grid-row:5}
.arena .cardhand {grid-column:1;grid-row:6}
.arena .seat {grid-template-columns:minmax(88px,10%) minmax(0,1fr) minmax(64px,7%);gap:8px;padding:6px 1vw}
.arena .portrait {align-content:center;gap:6px}
.arena .liveTable {min-height:180px}
.arena .liveZone {border-radius:8px;scrollbar-width:thin}
.arena .liveZone .fieldcards {padding:4px;gap:10px;min-width:0}
.arena .liveZone .fieldcards .tablecard {width:clamp(140px,12.8vw,220px)}
.arena .fieldcards .art {aspect-ratio:1.65}
.arena .cardhand {padding:10px 2vw 14px;gap:14px;justify-content:safe center}
.arena .cardhand .tablecard {width:clamp(160px,15vw,245px)}
.arena .cardhand .art {aspect-ratio:1.65}
.arena .cardhand .card p {max-height:66px;overflow:hidden;min-height:42px;font-size:clamp(12px,1vw,15px)}
.arena .tablecard:focus-visible {outline-offset:-3px}
.arena .resting .card,.arena .resting .cardback {transform:rotate(7deg) scale(.94);transform-origin:center;filter:saturate(.65)}
.arena .resolution span {max-width:75ch}
.arena .spotlight {position:relative;left:auto;right:auto;top:auto;transform:none;width:clamp(90px,9vw,140px);grid-column:1;grid-row:3;align-self:center;justify-self:start;margin:4px 0 4px 1vw;z-index:2}
.arena:has(.spotlight) .resolution {padding-left:clamp(110px,12vw,165px)}
.arena .spotlight .art {aspect-ratio:2.6}
.arena .spotlight .card h3 {font-size:12px}
.arena .spotlight.motion-play {animation:arena-spotlight-in .5s ease-out}
@keyframes arena-spotlight-in {from{opacity:0;transform:translateY(-12px) scale(.85)}}
dialog:has(.inspectCard) {width:min(560px,92vw);max-width:92vw}
.inspectCard .card {width:min(430px,100%)}
.inspectCard .card p {font-size:17px;line-height:1.4}
@media(min-width:700px) and (max-height:850px){
  body[data-mode="Playtest"] .arena {grid-template-rows:auto minmax(145px,1fr) auto minmax(145px,1fr) auto auto}
  .arena .liveTable {min-height:145px}
  .arena .liveZone .fieldcards .tablecard {width:clamp(116px,11.8vw,170px)}
  .arena .cardhand .tablecard {width:clamp(145px,13vw,195px)}
  .arena .cardhand .card p {max-height:52px}
  .arena .spotlight .art {display:none}
}
@media(min-width:700px) and (orientation:portrait){
  .arena .seat {grid-template-columns:minmax(80px,11%) minmax(0,1fr) 65px}
  .arena .liveTable {min-height:250px}
  .arena .cardhand .tablecard {width:clamp(160px,20vw,220px)}
}
@media(prefers-reduced-motion:reduce){.arena .tablecard,.arena .spotlight{animation:none!important;transition:none!important}}

/* Neutral placeholders, never substitute for uploaded artwork. */
.art-placeholder{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:#202a30;color:#e7e5df;isolation:isolate;container-type:inline-size}.art-placeholder span{position:absolute;font-size:clamp(42px,72cqw,240px);line-height:1;color:#ffffff12;z-index:-1}.art-placeholder strong{font:700 clamp(18px,24cqw,100px)/1 system-ui,sans-serif;letter-spacing:.08em}.art:has(.art-placeholder):before,.art:has(.art-placeholder):after{display:none}.mini img{width:100%;height:100%;object-fit:cover}.mini{overflow:hidden;font-size:10px;font-weight:700}

.monogram-art{position:relative;display:grid!important;place-items:center;isolation:isolate;overflow:hidden;background:#202a30!important;color:#e7e5df!important;container-type:inline-size;min-height:48px}.monogram-symbol{position:absolute;font-size:clamp(36px,70cqw,200px);opacity:.09;line-height:1;z-index:-1}.monogram-letters{font:700 clamp(16px,23cqw,80px)/1 system-ui,sans-serif!important;letter-spacing:.08em}

function checkStructure(m) {

  if (!Array.isArray(m.types) || !m.types.length || m.types.length > 30 || !unique(m.types) || m.types.some(t => !label(t.name) || !["unit","event"].includes(t.behavior))) fail("Invalid card types.");

  for (const z of m.table) {

  }

function deckIssues(m, counts, seat = null) {
  const total = Object.values(counts).reduce((n,v) => n+v, 0);
  const issues = [];
  if (total<m.deckRules.min || total>m.deckRules.max) issues.push("Deck needs "+m.deckRules.min+"–"+m.deckRules.max+" cards.");
  for (const c of m.cards) {
    if ((counts[c.id]||0)>m.deckRules.copies) issues.push(c.name+" exceeds the "+m.deckRules.copies+" copy limit.");
  }
  const needed = m.rules.hand + m.table.reduce((n,z) => n+(z.kind==="cards" && (z.owner==="player" || seat===0) ? z.start : 0),0);

    t.oncomplete = ok;
    t.onabort = t.onerror = () => no(t.error);

  const req = (await db).transaction("modules").objectStore("modules").getAll();

// Isolated rules kernel: deterministic card instances and ordered zones.
// This is an internal primitive, not a player-facing action/authorization API.
const own=(obj,key)=>Object.hasOwn(obj,key);
const key=x=>typeof x==="string"&&/^[A-Za-z0-9_-]{1,80}$/.test(x)&&!own(Object.prototype,x);
const fail=message=>{throw new Error(message)};
const lookup=(obj,id,kind)=>key(id)&&own(obj,id)?obj[id]:fail("Unknown "+kind+": "+id);

function createState({players,definitions,zones}){
  if(!Array.isArray(players)||!players.length||!players.every(key)||new Set(players).size!==players.length)fail("Invalid players");
  if(!Array.isArray(definitions)||!definitions.every(key)||new Set(definitions).size!==definitions.length)fail("Invalid definitions");
  if(!Array.isArray(zones)||!zones.length)fail("No zones");
  const state={version:1,players:[...players],definitions:[...definitions],nextId:1,zones:{},objects:{}};
  for(const z of zones){
    if(!z||!key(z.id)||own(state.zones,z.id)||!(z.owner===null||players.includes(z.owner))||
      !["public","owner","hidden"].includes(z.visibility)||(z.visibility==="owner"&&z.owner===null)||
      !Number.isSafeInteger(z.capacity)||z.capacity<0)fail("Invalid zone");
    state.zones[z.id]={id:z.id,owner:z.owner,visibility:z.visibility,capacity:z.capacity,cards:[]};
  }
  return state;
}

function assertPlayer(s,p){if(!s.players.includes(p))fail("Unknown player")}
function assertPosition(i,n){if(!Number.isSafeInteger(i)||i<0||i>n)fail("Invalid insertion position")}
function assertFace(face){if(!["up","down"].includes(face))fail("Invalid face")}
function locate(s,id){
  lookup(s.objects,id,"object");
  const matches=Object.values(s.zones).filter(z=>z.cards.includes(id));
  if(matches.length!==1)fail("Invalid zone membership: "+id);
  return matches[0];
}
function assertSpace(z){if(z.cards.length>=z.capacity)fail("Zone is full: "+z.id)}

function addCard(state,{definition,owner,controller=owner,zone,face="up",position}){
  if(!state.definitions.includes(definition))fail("Unknown definition");
  assertPlayer(state,owner);assertPlayer(state,controller);assertFace(face);
  const z=lookup(state.zones,zone,"zone");assertSpace(z);
  const at=position??z.cards.length;assertPosition(at,z.cards.length);
  if(!Number.isSafeInteger(state.nextId)||state.nextId<1||state.nextId>=Number.MAX_SAFE_INTEGER)fail("Object ID exhausted");
  const id="c"+state.nextId;if(own(state.objects,id))fail("Duplicate object ID");
  const next=structuredClone(state);
  next.nextId++;
  next.objects[id]={id,definition,owner,controller,face,orientation:"ready",damage:0,counters:{}};
  next.zones[zone].cards.splice(at,0,id);
  return {state:next,id};
}

// Explicit transition semantics: preserve instance state unless requested otherwise.
// A same-zone movement uses the destination position AFTER removing the object.
function moveCard(state,{id,from,to,position,face,controller,reset=false}){
  const object=lookup(state.objects,id,"object");
  const src=locate(state,id),dst=lookup(state.zones,to,"zone");
  if(src.id!==from)fail("Card is not in source zone");
  if(src!==dst)assertSpace(dst);
  const length=dst.cards.length-(src===dst?1:0),at=position??length;
  assertPosition(at,length);
  if(face!==undefined)assertFace(face);
  if(controller!==undefined)assertPlayer(state,controller);
  if(typeof reset!=="boolean")fail("Invalid reset policy");
  const next=structuredClone(state),o=next.objects[id];
  next.zones[from].cards.splice(src.cards.indexOf(id),1);
  next.zones[to].cards.splice(at,0,id);
  // A reveal is scoped to the current stay in a zone, never a later return.
  if(from!==to&&next.reveals)delete next.reveals[id];
  if(reset){o.orientation="ready";o.damage=0;o.counters={};o.controller=object.owner;}
  if(face!==undefined)o.face=face;
  if(controller!==undefined)o.controller=controller;
  return {state:next,event:{type:"cardMoved",id,from,to,position:at}};
}

// Hidden zones and concealed cards disclose no definition IDs, instance IDs,
// characteristics or order. Count-only concealment is intentionally conservative.
function projectState(state,viewer){
  assertPlayer(state,viewer);
  const zones=Object.values(state.zones).map(z=>{
    const result={id:z.id,owner:z.owner,visibility:z.visibility,capacity:z.capacity,count:z.cards.length};
    if(z.visibility==="hidden"||(z.visibility==="owner"&&z.owner!==viewer))return result;
    result.cards=z.cards.map(id=>{
      const o=lookup(state.objects,id,"object");
      if(o.face==="down"&&o.owner!==viewer)return {face:"down"};
      return structuredClone(o);
    });
    return result;
  });
  return {version:state.version,players:[...state.players],zones};
}

function assertInvariants(state){
  const seen=new Set();
  for(const z of Object.values(state.zones)){
    if(z.cards.length>z.capacity)fail("Zone exceeds capacity");
    for(const id of z.cards){
      if(seen.has(id))fail("Duplicate zone membership: "+id);
      seen.add(id);const o=lookup(state.objects,id,"object");
      if(o.id!==id||!state.definitions.includes(o.definition))fail("Invalid object");
      assertPlayer(state,o.owner);assertPlayer(state,o.controller);assertFace(o.face);
    }
  }
  if(seen.size!==Object.keys(state.objects).length)fail("Unplaced objects");
  for(const o of Object.values(state.objects))for(const c of o.components??[]){if(!key(c.id)||seen.has(c.id)||!state.definitions.includes(c.definition)||!state.definitions.includes(c.physicalDefinition)||!state.players.includes(c.owner))fail("Invalid stack component");seen.add(c.id)}
  return true;
}

// v1 compatibility bridge. The legacy engine remains authoritative.
// Snapshot instance IDs are deterministic within a snapshot, NOT stable across
// separate snapshots: v1 stores indistinguishable definition IDs in piles.
const seats=["p0","p1"];
const baseZone=(i,name)=>"base-"+i+"-"+name;
const tableZone=(i,id)=>"table-"+i+"-"+id;

// v1 zone IDs may be 80 characters. Kernel IDs have the same bound, so
// use stable numeric zone keys and keep the original IDs in the mapping.
function legacySnapshot(module,legacy){
  const m=validate(structuredClone(module));
  if(!legacy||!Array.isArray(legacy.players)||legacy.players.length!==2)throw Error("Expected v1 match");
  const specs=[],entries=[];
  const tableKeys=new Map();
  const definitions=new Map(m.cards.map(c=>[c.id,c]));
  const put=(id,owner,visibility,capacity,items)=>{
    if(!Array.isArray(items))throw Error("Invalid legacy pile");
    specs.push({id,owner,visibility,capacity});
    entries.push({id,items});
  };
  const plain=(cards,i)=>cards.map(definition=>({definition,owner:seats[i],face:"up"}));
  for(const [i,p] of legacy.players.entries()){
    // v1 has no fixed runtime capacity on base piles.
    for(const [name,visibility] of [["deck","hidden"],["hand","owner"],["discard","public"]]){
      put(baseZone(i,name),seats[i],visibility,Number.MAX_SAFE_INTEGER,plain(p[name],i));
    }
    for(const [j,z] of m.table.entries()){
      if(z.owner!=="player")continue;
      const id=tableZone(i,j);tableKeys.set(i+":"+z.id,id);
      const items=z.kind==="units"?p.field.filter(u=>(u.zone||"field")===z.id).map(u=>{
        const c=definitions.get(u.id);
        if(!c)throw Error("Unknown legacy unit definition");
        return {definition:u.id,owner:seats[i],face:u.hidden?"down":"up",orientation:u.ready?"ready":"resting",damage:Math.max(0,(u.hidden?2:c.health)-u.hp),legacyHP:u.hp};
      }):plain(p.zones[z.id],i);
      put(id,seats[i],z.visibility,z.capacity,items);
    }
    if(p.field.some(u=>!m.table.some(z=>z.kind==="units"&&z.owner==="player"&&z.id===(u.zone||"field"))))throw Error("Unknown legacy unit zone");
  }
  for(const [j,z] of m.table.entries()){
    if(z.owner!=="shared")continue;
    const id=tableZone("shared",j);tableKeys.set("shared:"+z.id,id);
    // v1 shared setup cards originate exclusively from seat zero's deck.
    // v1 permits owner visibility on shared zones; conservatively conceal.
    put(id,null,z.visibility==="owner"?"hidden":z.visibility,z.capacity,plain(legacy.shared[z.id],0));
  }
  put("pending",null,"public",1,legacy.pending?[{definition:legacy.pending.id,owner:seats[legacy.pending.who],face:"up"}]:[]);
  const state=createState({players:seats,definitions:[...definitions.keys()],zones:specs});
  // Bulk initialization avoids quadratic cloning for large imported decks.
  // The state has not escaped this function, and each entry is validated.
  for(const {id,items} of entries){
    const zone=state.zones[id];
    if(items.length>zone.capacity)throw Error("Legacy zone exceeds capacity: "+id);
    for(const item of items){
      if(!definitions.has(item.definition)||!seats.includes(item.owner))throw Error("Invalid legacy card");
      const objectId="c"+state.nextId++;
      state.objects[objectId]={id:objectId,definition:item.definition,owner:item.owner,controller:item.owner,face:item.face,orientation:item.orientation??"ready",damage:item.damage??0,counters:{}};
      zone.cards.push(objectId);
    }
  }
  assertInvariants(state);
  return {state,tableKeys:Object.fromEntries(tableKeys),turn:{
    phase:legacy.phase,actor:seats[legacy.actor],active:seats[legacy.turn],
    round:legacy.round,winner:legacy.winner===null?null:seats[legacy.winner],
    resources:legacy.players.map(p=>({life:p.life,energy:p.energy}))
  }};
}

function initializeLegacyBridge(module,seed){
  const m=validate(structuredClone(module));
  const legacy=start(m,seed);
  return {legacy,...legacySnapshot(m,legacy)};
}

// Transactional bridge for explicit v1 actions. The legacy rules engine still
// decides legality and outcomes. The kernel tracks exact instance movement.
const base=(i,pile)=>"base-"+i+"-"+pile;
const fieldZone=(bridge,i,u)=>bridge.tableKeys[i+":"+(u.zone||"field")];
const reject=message=>{throw Error(message)};
const indexOK=(n,length)=>Number.isSafeInteger(n)&&n>=0&&n<length;
function trackedFieldId(bridge,legacy,i,index){
 const u=legacy.players[i].field[index];
 if(!u)reject("Unknown field index");
 const zone=fieldZone(bridge,i,u);
 const local=legacy.players[i].field.slice(0,index).filter(v=>fieldZone(bridge,i,v)===zone).length;
 return bridge.state.zones[zone].cards[local];
}
function fieldIndex(bridge,legacy,i,id){
 return legacy.players[i].field.findIndex((_,index)=>trackedFieldId(bridge,legacy,i,index)===id);
}
function startTracked(module,seed){
 const m=validate(structuredClone(module));
 return initializeLegacyBridge(m,seed);
}
// Choices are based on legacy legality, with persistent identifiers for owned
// cards. Opposing concealed targets use public field positions, not instance IDs.
function trackedChoices(module,bridge,actor){
 const m=validate(structuredClone(module)),l=bridge.legacy;
 if(![0,1].includes(actor)||l.actor!==actor||l.winner!==null)return [];
 const p=l.players[actor],out=[{type:"pass",actor}];
 for(const [index] of p.hand.entries()){
  if(!reason(m,l,actor,index))out.push({type:"play",actor,id:bridge.state.zones[base(actor,"hand")].cards[index]});
 }
 if(!l.pending&&l.turn===actor){
  for(const [index,u] of p.field.entries()){
   if(!u.ready)continue;
   const id=trackedFieldId(bridge,l,actor,index);
   if(u.hidden){out.push({type:"reveal",actor,id});continue}
   if(!m.phases[l.phase||0].attack)continue;
   const c=m.cards.find(c=>c.id===u.id);
   for(const [move,a] of c.attacks.entries()){
    if(a.cost>p.energy)continue;
    for(const target of legalTargets(m,l,actor))out.push({type:"attack",actor,id,move,target});
   }
  }
 }
 return out;
}
function applyTracked(module,bridge,action){
 const m=validate(structuredClone(module)),before=bridge.legacy;
 const {actor:i,type}=action??{};
 if(![0,1].includes(i)||before.actor!==i||before.winner!==null)reject("Action unavailable");
 const l=structuredClone(before);
 let state=structuredClone(bridge.state),events=[];
 const move=(id,from,to,extra={})=>{
  const r=moveCard(state,{id,from,to,...extra});state=r.state;events.push(r.event);
 };
 const hand=base(i,"hand"),pending=state.zones.pending.cards[0];
 let played=null,attacked=null;
 if(type==="play"){
  const index=state.zones[hand].cards.indexOf(action.id);
  if(!indexOK(index,l.players[i].hand.length))reject("Card is not in hand");
  played={id:action.id,owner:i,definition:l.players[i].hand[index]};
  act(m,l,i,index);
 }else if(type==="pass")pass(m,l,i);
 else if(type==="reveal"){
  const index=fieldIndex(bridge,before,i,action.id);
  if(index<0)reject("Card is not in your field");
  reveal(m,l,i,index);
 }else if(type==="attack"){
  const index=fieldIndex(bridge,before,i,action.id);
  if(index<0||!Number.isSafeInteger(action.move)||!Number.isSafeInteger(action.target))reject("Invalid attack choice");
  const target=action.target;
  if(target!==-1&&!indexOK(target,before.players[1-i].field.length))reject("Invalid target");
  if(target!==-1)attacked={id:trackedFieldId(bridge,before,1-i,target),zone:fieldZone(bridge,1-i,before.players[1-i].field[target])};
  attack(m,l,i,index,action.move,target);
 }else reject("Unknown action");

 // Each accepted legacy action removes at most one hand card. Resolve that
 // card and any prior pending card explicitly; draws always take a deck prefix.
 if(played){
  const c=m.cards.find(c=>c.id===played.definition);
  if(l.pending&&l.pending.who===i&&!before.pending){
   move(played.id,hand,"pending");
  }else if(c.kind==="unit"){
   const z=bridge.tableKeys[i+":"+c.zone];
   const hidden=c.entry==="hidden"&&c.timing==="main"&&!before.pending;
   move(played.id,hand,z,{face:hidden?"down":"up"});
  }else move(played.id,hand,base(i,"discard"));
 }
 if(pending&&!l.pending){
  const who=before.pending.who,c=m.cards.find(c=>c.id===before.pending.id);
  // The reaction can end the match before the pending unit resolves.
  const fieldAdded=l.players[who].field.length>before.players[who].field.length;
  if(c.kind==="unit"&&fieldAdded)move(pending,"pending",bridge.tableKeys[who+":"+c.zone]);
  else move(pending,"pending",base(who,"discard"));
 }
 if(attacked&&l.players[1-i].field.length<before.players[1-i].field.length)
  move(attacked.id,attacked.zone,base(1-i,"discard"),{face:"up",reset:true});
 for(const [seat,p] of l.players.entries()){
  const deck=base(seat,"deck"),dest=base(seat,"hand");
  const count=before.players[seat].deck.length-p.deck.length;
  if(count<0)reject("Unsupported deck mutation");
  for(let n=0;n<count;n++)move(state.zones[deck].cards[0],deck,dest);
 }
 // Compare ordered definition sequences against independently converted v1
 // state. Never guess identity from duplicate definitions on mismatch.
 const expected=legacySnapshot(m,l);
 for(const [zone,z] of Object.entries(expected.state.zones)){
  const actual=state.zones[zone];
  if(actual.cards.length!==z.cards.length)reject("Bridge mismatch: "+zone);
  for(const [index,id] of actual.cards.entries()){
   const o=state.objects[id],e=expected.state.objects[z.cards[index]];
   if(o.definition!==e.definition||o.owner!==e.owner)reject("Bridge identity mismatch: "+zone);
   o.face=e.face;o.orientation=e.orientation;o.damage=e.damage;
  }
 }
 assertInvariants(state);
 return {bridge:{legacy:l,state,tableKeys:expected.tableKeys,turn:expected.turn},events};
}
function trackedView(bridge,actor){
 if(![0,1].includes(actor))reject("Unknown viewer");
 return {...projectState(bridge.state,"p"+actor),turn:structuredClone(bridge.turn)};
}

// Use the existing bot's deterministic choice policy without changing its behavior.
// Compare candidate transitions to its result; identical transitions use the
// first legal choice, since v1 has no distinction between duplicate cards.
function trackedBot(module,bridge,legacyBot){
 const expected=structuredClone(bridge.legacy);
 legacyBot(module,expected);
 for(const action of trackedChoices(module,bridge,bridge.legacy.actor)){
   const result=applyTracked(module,bridge,action);
   if(JSON.stringify(result.bridge.legacy)===JSON.stringify(expected))return result;
 }
 throw Error("Legacy bot action could not be mapped");
}

    else if(k.startsWith("type:")){const [,id,prop]=k.split(":");m.types.find(t=>t.id===id)[prop]=value;}
    else if(k.startsWith("attribute:")){const [,id,prop]=k.split(":");m.attributes.find(t=>t.id===id)[prop]=value;}
