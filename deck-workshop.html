<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual deck workshop</title><link rel="stylesheet" href="duel.css"><link rel="stylesheet" href="deck-workshop.css"></head><body><main id="deck-workshop"><header class="workshop-head"><a href="module-editor.html?resume=1">Return to module editor</a><h1>Deck workshop</h1><p id="deck-module"></p></header><section class="workshop-toolbar"><label>Deck <select id="deck-select"></select></label><button id="deck-new">New deck</button><button id="deck-copy">Duplicate</button><button id="deck-remove">Delete deck</button><button id="deck-done">Apply to module editor</button></section><div id="deck-error" role="status"></div><div class="workshop-layout"><section><h2>Card collection</h2><div class="workshop-toolbar"><label>Search <input id="card-search" type="search" placeholder="Name or rules"></label><label>Card type <select id="type-filter"></select></label><label>Sort <select id="card-sort"><option value="name">Name</option><option value="attack">Attack</option><option value="health">Health</option></select></label></div><div id="card-gallery" class="card-gallery"></div></section><aside class="deck-panel"><h2>Current deck</h2><label>Name <input id="deck-name"></label><label>Player <select id="deck-player"></select></label><label>Destination <select id="deck-zone"></select></label><div id="deck-stats"></div><div id="deck-list" aria-label="Deck cards"></div><button id="deck-validate">Validate deck</button></aside></div></main><script type="module" src="deck-workshop.js"></script></body></html>
