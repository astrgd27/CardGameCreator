name: Validate workshop
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check browser entry point syntax
        run: |
          for file in product.js basic-module.js rule-composer.js play.js module-editor.js duel.js reference-home.js module-home.js; do
            node --check "$file" || exit 1
          done
      - run: npm test
      - run: node scripts/benchmark-report.mjs
      - name: Build and validate offline distribution
        run: |
          python scripts/offline_bundle.py /tmp/CardGameCreator-offline.zip
          python -m zipfile -t /tmp/CardGameCreator-offline.zip
          python -c "import zipfile; z=zipfile.ZipFile('/tmp/CardGameCreator-offline.zip'); assert {'index.html','product.js','product.css','rule-composer.js','play.html','play.js','play.css','art/looboo.webp','duel.html','module-editor.html','kernel/runtime.js','launch.py'} <= set(z.namelist()); compile(z.read('launch.py'), 'launch.py', 'exec')"
      - uses: actions/upload-artifact@v4
        with:
          name: CardGameCreator-offline
          path: /tmp/CardGameCreator-offline.zip
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
